[project]
name = "heybrowsy-api"
version = "0.1.0"
description = "Agent orchestration API for heybrowsy"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.6,<3",
  "anthropic>=0.122,<1",
  "google-genai>=2.0,<3",
  "json-repair>=0.63.2,<1"
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
